name: 特性建议
description: 提议 hui-api 的新特性或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你遇到的具体场景，而不是直接给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为，如有可能给出交互示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选与现状绕过
      description: 你现在如何绕过这个限制？
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已检索现有 issue，确认没有重复提议
          required: true
        - label: 我理解本项目定位为轻量单机网关（见 docs/00 非目标）
          required: true
